[project]
name = "reviewgate"
version = "0.1.0"
description = "Code review gate. Currently ships the history agent: git-derived priors (hot spots, regression risk, co-change gaps, precedents) for a diff."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "mooyee0929" }]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.13",
    "ruff>=0.8",
]

[project.scripts]
reviewgate = "reviewgate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".venv"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
